<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="platter_server">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>platter_server</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0; /* Ensure no default margins interfere */
      overflow: hidden; /* Hide scrollbars while splash is visible */
    }
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999; /* High z-index to be on top */
      transition: opacity 0.5s ease-out; /* Optional: fade out effect */
    }
    #splash-screen img {
      max-width: 100px;
      max-height: 100px;
    }
  </style>
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash-screen">
    <img src="assets/splash_image.svg" alt="Loading..." />
  </div>
  <script>
    window.addEventListener('load', function(ev) {
      // Minimum 2 seconds splash display
      setTimeout(function() {
        var splashScreen = document.getElementById('splash-screen');
        if (splashScreen) {
          splashScreen.style.opacity = '0'; // Start fade out
          setTimeout(function() { // Wait for fade out to complete
            splashScreen.style.display = 'none';
            document.body.style.overflow = ''; // Restore overflow
          }, 500); // Must match CSS transition duration
        }
      }, 2000); // 2000 milliseconds = 2 seconds
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
