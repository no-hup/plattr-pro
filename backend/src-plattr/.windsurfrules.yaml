# .windsurfrules.yaml

rules:
  - description: "Always use Dart and Flutter best practices for code structure and naming."
    applies_to: ["*.dart"]
    severity: "high"

  - description: "All API sample response files must use the .md extension, never .js."
    applies_to: ["*Sample*"]
    severity: "medium"

  - description: "Never start Firebase emulators automatically. Emulator startup must always be triggered manually by the user."
    applies_to: ["*"]
    severity: "critical"

  - description: "Automatically handle small file operations (creation, deletion, modification) without asking for consent. Only ask for confirmation for significant changes or potentially destructive actions."
    applies_to: ["*"]
    severity: "medium"
